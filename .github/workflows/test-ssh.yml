name: Testar SSH na VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/test-ssh.yml]

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar chave
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "Secret VPS_SSH_KEY vazio ou ausente"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_vps
          chmod 600 ~/.ssh/id_vps
          ssh-keyscan -H 217.217.252.30 >> ~/.ssh/known_hosts
      - name: Rodar comandos de leitura
        run: |
          ssh -i ~/.ssh/id_vps -o BatchMode=yes root@217.217.252.30 \
            'whoami; hostname; uname -a; cat /etc/os-release | head -2; node -v 2>/dev/null || echo "node nao instalado"; npm -v 2>/dev/null || true; df -h / | tail -1; free -m | head -2'
